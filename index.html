<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Christian Goblin</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, Helvetica, sans-serif;

      min-height:100vh;

      background:
        radial-gradient(circle at top, #1b1b1b 0%, #090909 70%);

      color:white;

      display:flex;
      justify-content:center;
      align-items:center;

      padding:30px 15px;
    }

    .container{
      width:100%;
      max-width:620px;

      background:#111;

      border:1px solid #222;

      border-radius:28px;

      padding:40px 25px;

      text-align:center;

      box-shadow:
        0 0 40px rgba(0,0,0,0.6);
    }

    .profile-frame{
      width:150px;
      height:150px;

      margin:0 auto 20px;

      border-radius:50%;

      padding:5px;

      background:
        linear-gradient(
          135deg,
          #8d6b2f,
          #e0c48d,
          #8d6b2f
        );

      box-shadow:
        0 0 25px rgba(224,196,141,0.15);
    }

    .profile-img{
      width:100%;
      height:100%;

      border-radius:50%;

      object-fit:cover;

      border:4px solid #111;
    }

    h1{
      font-size:2.8rem;

      margin-bottom:12px;

      color:#f3d9a2;

      letter-spacing:1px;
    }

    .divider{
      width:180px;

      margin:0 auto 24px;

      opacity:0.8;
    }

    .tagline{
      color:#b8b8b8;

      font-size:1rem;

      margin-bottom:35px;

      line-height:1.6;
    }

    .links{
      display:flex;
      flex-direction:column;

      gap:16px;
    }

    .links a{
      text-decoration:none;

      color:white;

      background:
        linear-gradient(
          rgba(0,0,0,0.72),
          rgba(0,0,0,0.72)
        ),
        url("./assets/images/button-5.png");

      background-size:cover;
      background-position:center;

      border:1px solid rgba(255,255,255,0.08);

      border-radius:16px;

      padding:18px 20px;

      transition:0.25s ease;

      font-size:1rem;
    }

    .links a:hover{
      transform:translateY(-3px);

      border-color:#d6b57a;

      box-shadow:
        0 0 18px rgba(214,181,122,0.18);

      color:#ffe8bb;
    }

    .link-content{
      display:flex;

      align-items:center;
      justify-content:center;

      gap:12px;
    }

    .icon{
      width:22px;
      height:22px;

      object-fit:contain;
    }

    footer{
      margin-top:35px;

      color:#777;

      font-size:0.9rem;
    }

    @media(max-width:600px){

      h1{
        font-size:2.1rem;
      }

      .container{
        padding:35px 18px;
      }

      .links a{
        font-size:0.95rem;
        padding:16px;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <div class="profile-frame">

      <img
        class="profile-img"
        src="./assets/images/profile.png"
        alt="Christian Goblin"
      />

    </div>

    <h1>Christian Goblin</h1>

    <img
      class="divider"
      src="./assets/images/divider-simple.PNG"
      alt=""
    />

    <p class="tagline">
      Christian Creator • Streaming • Community
    </p>

    <div class="links">

      <a
        href="https://www.instagram.com/hello.viewers.2026/"
        target="_blank"
      >

        <div class="link-content">

          <img
            class="icon"
            src="./assets/images/icon-cross.png"
            alt=""
          />

          <span>
            Instagram — hello.viewers.2026
          </span>

        </div>

      </a>

      <a
        href="https://www.instagram.com/christian_goblin"
        target="_blank"
      >

        <div class="link-content">

          <img
            class="icon"
            src="./assets/images/icon-thorns.PNG"
            alt=""
          />

          <span>
            Instagram — christian_goblin
          </span>

        </div>

      </a>

      <a
        href="https://www.tiktok.com/@christiangoblin"
        target="_blank"
      >

        <div class="link-content">

          <img
            class="icon"
            src="./assets/images/icon-dove.PNG"
            alt=""
          />

          <span>
            TikTok
          </span>

        </div>

      </a>

      <a
        href="https://www.youtube.com/@christian_goblin"
        target="_blank"
      >

        <div class="link-content">

          <img
            class="icon"
            src="./assets/images/icon-shield.PNG"
            alt=""
          />

          <span>
            YouTube
          </span>

        </div>

      </a>

      <a
        href="https://m.twitch.tv/christian_goblin/home"
        target="_blank"
      >

        <div class="link-content">

          <img
            class="icon"
            src="./assets/images/icon-crown.png"
            alt=""
          />

          <span>
            Twitch
          </span>

        </div>

      </a>

      <a
        href="https://ko-fi.com/christiangoblin"
        target="_blank"
      >

        <div class="link-content">

          <img
            class="icon"
            src="./assets/images/icon-bible.PNG"
            alt=""
          />

          <span>
            Ko-fi
          </span>

        </div>

      </a>

      <a
        href="https://cash.app/$TheChristianGoblin"
        target="_blank"
      >

        <div class="link-content">

          <img
            class="icon"
            src="./assets/images/icon-pray.PNG"
            alt=""
          />

          <span>
            Cash App
          </span>

        </div>

      </a>

    </div>

    <footer>

      <img
        class="divider"
        src="./assets/images/divider-thorns.PNG"
        alt=""
      />

    </footer>

  </div>

</body>
</html>
