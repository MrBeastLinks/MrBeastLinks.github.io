<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Christian Goblin</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background: linear-gradient(135deg, #111, #1d1d1d, #2a2a2a);
      color:white;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:40px 20px;
    }

    .container{
      width:100%;
      max-width:700px;
      text-align:center;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:20px;
      padding:40px 30px;
      backdrop-filter: blur(10px);
      box-shadow:0 0 25px rgba(0,0,0,0.5);
    }

    .profile-img{
      width:140px;
      height:140px;
      border-radius:50%;
      object-fit:cover;
      border:4px solid #00ffcc;
      margin-bottom:20px;
    }

    h1{
      font-size:3rem;
      margin-bottom:10px;
      color:#00ffcc;
    }

    p{
      color:#ccc;
      margin-bottom:30px;
      font-size:1.1rem;
    }

    .links{
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .links a{
      text-decoration:none;
      color:white;
      background:#222;
      padding:16px;
      border-radius:12px;
      font-size:1.1rem;
      transition:0.3s ease;
      border:1px solid rgba(255,255,255,0.08);
    }

    .links a:hover{
      transform:translateY(-3px) scale(1.02);
      background:#00ffcc;
      color:#111;
      font-weight:bold;
    }

    footer{
      margin-top:30px;
      color:#777;
      font-size:0.9rem;
    }

    @media(max-width:600px){
      h1{
        font-size:2.2rem;
      }

      .links a{
        font-size:1rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Replace this image with your own -->
    <img 
      class="profile-img"

    />

    <p>
      Content Creator • Streamer • Goblin Energy
    </p>

    <div class="links">

        👹 Instagram (christian_goblin)
      </a>

      <a href="https://www.tiktok.com/@christiangoblin" target="_blank">
        🎵 TikTok
      </a>

      <a href="https://www.youtube.com/@christian_goblin?app=desktop&sub_confirmation=1" target="_blank">
        ▶️ YouTube
      </a>

      <a href="https://m.twitch.tv/christian_goblin/home" target="_blank">
        🎮 Twitch
      </a>

      <a href="https://www.patreon.com/profile/creators?u=152523171&utm_campaign=creatorshare_creator" target="_blank">
        ❤️ Patreon
      </a>

      <a href="https://ko-fi.com/christiangoblin" target="_blank">

      </a>

      <a href="https://cash.app/$TheChristianGoblin" target="_blank">
        💸 Cash App

    </div>

    <footer>
      © 2026 Christian Goblin

  </div>

</body>
